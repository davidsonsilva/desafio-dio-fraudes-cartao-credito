[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Sistema completo de detecção de fraudes e anomalias"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "imbalanced-learn>=0.13,<1",
  "joblib>=1.4,<2",
  "kaggle>=1.7,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.41,<2",
  "tensorflow>=2.16,<3",
  "uvicorn[standard]>=0.34,<1",
  "xgboost>=2.1,<4"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
